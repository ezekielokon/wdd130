<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>
<body>
<header>
<h1>WDD130 HTML Form - User Poll</h1>
</header>
<main>
<form>
    <div class="form-item column2">
    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" required>
    </div>


        <div class="form-item column2">
    <label for="useremail">Email:</label>
    <input type="email" id="useremail" name="Useremail" required>
        </div>



    <div class="form-item column1">
    <label for = "quantity"> Select Quantity</label>
    <select name = "quantity" id = "quantity">
        <option value="1">one</option>
        <option value="2">Two</option>
        <option value="3">Three</option>
    
    </div>
    </select>

 
    <div class="form-item column1">
    <label for = "browser"> Select your browser</label>
    <select name = "browser" id = "browser">
        <option value="chrome">Chrome</option>
        <option value="firefox">Firefox</option>
        <option value="edge">Edge</option>
        <option value="brave">Brave</option>
        <option value="other">Other</option>
    
    </div>
    </select>



    <div class="form-itm column1">
    <label for="pet"> Do you have a household pet?</label>
    <input type="checkbox" id="pet" name="pet">
    </div>



    <div class="form-item column5">
    <label for="feedback"> List the places you have lived:</label>
    <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
    </div>

<button type="submit">Submit Poll</button>
</form>
    </main> 
</body>
<footer>

    </footer>
</html>
