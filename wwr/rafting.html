<!DOCTYPE html>
<html lang="en">

    <meta name="description" content="White Water Rafting, WDD130, Contact us page">
    <link rel="stylesheet" href="styles/contact.css">
    
</head>
<body>
    <header>
        <img src="images/wwr.jpg" alt="White Water Rafting Logo">
   <nav class="link">
    <ul>
       <li><a href="index.html">Home</a></li>
         <li><a href="about.html">About Us</a></li>
         <li><a href="trips.html">Trips</a></li>
         <li><a href="contact.html">Contact Us</a></li>
    </ul>
    </nav>
    </header>
    <main>
    
    <section class="contact">
        <div class="contact-heading">
    <h1>Contact Us</h1>       
       <p> Main River Street Kolob,</p>
       <p> +1 999 999 9999</p> 
        <p>info@whitewater.com</p>
        </div>

        <div class="map">
            <iframe 
            src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d5692419.062269052!2d-110.20133774217845!3d45.84126170083451!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1790884390484!5m2!1sen!2sng"></iframe>
            </iframe>
        </div>
            
    
        <form>
    
        <div class="name">
            <label for="fullname"> Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>
    
    
    <div class="email">
        <label for="user email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your Email address" required>
        </div>
    

<div class="purpose">
<p>Purpose of Message</p>
<div class="purpose-options">
<input type="radio" id="general" name="purpose" value="general">
<label for="general">General Inquiry</label>

<input type="radio" id="reservation" name="purpose" value="reservation">
<label for="reservation">Reservation Question</label>

<input type="radio" id="suggestion" name="purpose" value="Suggestion">
<label for="suggestion">Website Suggestion</label>
</div>
</div>


    <div class="message">
    <label for="message">Message</label>
    <textarea id="message" name="message." rows="4" placeholder="Type here"></textarea>
    </div>



    <div class="phone">
    <label for="subscription">Please subscribe me to the monthly newsletter</label>
    <input type="checkbox" id="subscription" name="subscription">
    </div>



    <div class="touch">
    <button type="submit">Get in Touch!</button>
    </div>

            </form>
    </section>



<section class="profile">
    <h2>We are here to Serve You</h2>
    <figure>
        <img src="images/image.png " alt="profile 1 picture" >
        <figcaption>Employee Profile</figcaption>
    </figure>

     <figure>
        <img src="images/profile 2.png" alt="profile 2 picture" >
        <figcaption>Employee Profile</figcaption>
    </figure>

     <figure>
        <img src="images/profile 3.png" alt="profile 3 picture">
        <figcaption>Employee Profile</figcaption>
    </figure>
</section>
</main>

            </a>
        </nav>
    </footer>
</body>
</html>
